<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title></title>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="brand"><span class="dot"></span> <a href="index.html" id="brandName"></a><span class="mono" style="color:var(--muted); font-weight:400;">.store</span></div>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="katalog.html">Katalog</a>
    <a href="panduan.html" class="active">Panduan</a>
    <a href="kontak.html">Cara Beli</a>
  </div>
</nav>

<section class="section">
  <div class="section-head">
    <span class="tag">// panduan</span>
    <h2>Cara pemasangan &amp; penggunaan</h2>
    <p>Tiap produk punya cara pakainya sendiri-sendiri. Pilih produknya di bawah buat lihat langkah lengkap & video (kalau ada).</p>
  </div>

  <div class="catalog" id="panduanGrid"></div>

  <div class="help-box">
    <div>
      <h3>Masih bingung?</h3>
      <p>Chat admin langsung, kirim screenshot kalau perlu.</p>
    </div>
    <div class="help-actions" id="helpActions"></div>
  </div>
</section>

<footer>
  <span>© 2026 <span id="brandFooter">StarDev</span></span>
  <span class="mono footer-text"></span>

</footer>

<script src="data/loader.js"></script>
<script src="data/site-meta.js"></script>
<script>
  applySiteMeta('panduan');
  const grid = document.getElementById('panduanGrid');
  // Render compact, collapsible list to keep panduan rapi
  grid.innerHTML = SITE_DATA.produk.map(p => {
    const short = (p.deskripsi || '').length > 140 ? (p.deskripsi || '').slice(0,140).trim() + '…' : (p.deskripsi || '');
    return `
      <details class="panduan-item card">
        <summary>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;">
            <div>
              <span class="kind mono">${p.kategori}</span>
              <strong style="display:block; font-size:1.05rem; margin-top:6px;">${p.nama}</strong>
              <div style="color:var(--muted); font-size:0.95rem; margin-top:6px;">${short}</div>
            </div>
            <div class="mono" style="color:var(--muted); font-size:0.9rem;">Lihat ▾</div>
          </div>
        </summary>
        <div style="margin-top:12px;">
          <p style="color:var(--text);">${p.deskripsi}</p>
          <a href="produk.html?id=${encodeURIComponent(p.id)}#cara-pakai" class="btn btn-ghost" style="margin-top:8px; display:inline-block;">Buka panduan lengkap</a>
        </div>
      </details>
    `;
  }).join('');

  const helpActions = document.getElementById('helpActions');
  // Dedupe contacts for help actions (keep owner flag if any)
  const raw = (SITE_DATA.kontak && SITE_DATA.kontak.telegram) ? SITE_DATA.kontak.telegram : [];
  const cmap = new Map();
  raw.forEach(c => {
    const key = (c.link || c.nama || '').toLowerCase();
    if (!cmap.has(key)) cmap.set(key, { nama: c.nama, link: c.link, owner: !!c.owner });
    else {
      const ex = cmap.get(key); ex.owner = ex.owner || !!c.owner; cmap.set(key, ex);
    }
  });
  const uniq = Array.from(cmap.values());
  helpActions.innerHTML = uniq.map((t,i) => `
    <a class="btn ${i === 0 ? 'btn-primary' : 'btn-ghost'}" href="${t.link}" target="_blank" rel="noopener">
      ${t.owner ? '👑 ' : ''}@${t.nama}
    </a>
  `).join('');
</script>

</body>
</html>
