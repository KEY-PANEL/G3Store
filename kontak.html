<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cara Beli // Cdaaptnia</title>
<meta name="description" content="Hubungi admin Cdaaptnia lewat Telegram buat proses pembelian.">
<meta property="og:type" content="website">
<meta property="og:title" content="Cara Beli // Cdaaptnia">
<meta property="og:description" content="Hubungi admin Cdaaptnia lewat Telegram buat proses pembelian.">
<meta property="og:image" content="{URL_WEBSITE}/assets/og-image.png">
<meta property="og:url" content="{URL_WEBSITE}/kontak.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="brand"><span class="dot"></span> <a href="index.html">Cdaaptnia</a><span class="mono" style="color:var(--muted); font-weight:400;">.store</span></div>
  <div class="links">
    <a href="katalog.html">Katalog</a>
    <a href="panduan.html">Panduan</a>
    <a href="kontak.html" class="active">Cara Beli</a>
  </div>
</nav>

<section class="section">
  <div class="section-head">
    <span class="tag">// cara beli</span>
    <h2>Mau beli? Tinggal chat aja</h2>
    <p>Nggak ada checkout otomatis — semua transaksi diproses manual lewat Telegram. Sebutin nama produk & paket yang kamu mau pas chat, ya.</p>
  </div>

  <div id="channelList" class="channels"></div>

  <div class="faq-block">
    <h3 class="faq-title">Pertanyaan yang sering ditanya</h3>
    <div class="faq" id="faqList"></div>
  </div>
</section>

<footer>
  <span>© 2026 Cdaaptnia</span>
  <span class="mono">status: open for orders</span>
</footer>

<script src="data.js"></script>
<script>
  const list = document.getElementById('channelList');

  list.innerHTML = SITE_DATA.kontak.telegram.map(t => `
    <a class="channel tg" href="${t.link}" target="_blank" rel="noopener">
      <div class="left">
        <span class="chip"></span> @${t.nama}
        ${t.owner ? '<span class="owner-badge">👑 OWNER</span>' : ''}
      </div>
      <span class="go mono">chat →</span>
    </a>
  `).join('');

  const faqList = document.getElementById('faqList');
  faqList.innerHTML = SITE_DATA.faq.map(f => `
    <details class="faq-item">
      <summary>${f.tanya}</summary>
      <p>${f.jawab}</p>
    </details>
  `).join('');
</script>

</body>
</html>
