<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog // Cdaaptnia</title>
<meta name="description" content="Lihat semua produk Cdaaptnia — script, app, dan tools lainnya lengkap dengan fitur & harga.">
<meta property="og:type" content="website">
<meta property="og:title" content="Katalog // Cdaaptnia">
<meta property="og:description" content="Lihat semua produk Cdaaptnia — script, app, dan tools lainnya lengkap dengan fitur & harga.">
<meta property="og:image" content="{URL_WEBSITE}/assets/og-image.png">
<meta property="og:url" content="{URL_WEBSITE}/katalog.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="brand"><span class="dot"></span> <a href="index.html">Cdaaptnia</a><span class="mono" style="color:var(--muted); font-weight:400;">.store</span></div>
  <div class="links">
    <a href="katalog.html" class="active">Katalog</a>
    <a href="panduan.html">Panduan</a>
    <a href="kontak.html">Cara Beli</a>
  </div>
</nav>

<section class="section">
  <div class="section-head">
    <span class="tag">// katalog</span>
    <h2>Produk yang tersedia</h2>
    <p>Pilih produk, tekan View buat lihat paket harga, cara pakai, dan fitur lengkapnya.</p>
  </div>

  <div class="catalog" id="catalogGrid"></div>
</section>

<footer>
  <span>© 2026 Cdaaptnia</span>
  <a href="kontak.html" class="mono">cara beli →</a>
</footer>

<script src="data.js"></script>
<script>
  const grid = document.getElementById('catalogGrid');

  SITE_DATA.produk.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const thumb = p.gambar
      ? `<div class="card-thumb"><img src="${p.gambar}" alt="Preview ${p.nama}" loading="lazy"></div>`
      : `<div class="card-thumb placeholder">Belum ada preview</div>`;
    const hargaMulai = p.paket && p.paket.length
      ? `mulai ${p.paket.reduce((a,b) => (parseInt(a.harga.replace(/\D/g,'')) < parseInt(b.harga.replace(/\D/g,'')) ? a : b)).harga}`
      : '';
    card.innerHTML = `
      ${thumb}
      <span class="kind mono">${p.kategori}</span>
      <h3>${p.nama}</h3>
      <p>${p.deskripsi}</p>
      <div class="price">${hargaMulai}</div>
      <a href="produk.html?id=${encodeURIComponent(p.id)}" class="buy">View</a>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
