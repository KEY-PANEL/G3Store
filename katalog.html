<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title></title>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="brand"><span class="dot"></span> <a href="index.html" id="brandName"></a><span class="mono" style="color:var(--muted); font-weight:400;">.store</span></div>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="katalog.html" class="active">Katalog</a>
    <a href="panduan.html">Panduan</a>
    <a href="kontak.html">Cara Beli</a>
  </div>
</nav>

<section class="section">
  <div class="section-head">
    <span class="tag">// katalog</span>
    <h2>Produk yang tersedia</h2>
    <p>Pilih produk, tekan View buat lihat paket harga, cara pakai, dan fitur lengkapnya.</p>
  </div>

  <div class="dir-window">
    <div class="dir-bar">
      <span class="tl"></span><span class="tl"></span><span class="tl"></span>
      <span class="path">~/katalog</span>
    </div>
    <div class="dir-head">
      <span>nama</span><span>tipe</span><span>harga mulai</span><span></span>
    </div>
    <div id="catalogGrid"></div>
  </div>
</section>

<footer>
  <span>© 2026 <span id="brandFooter">StarDev</span></span>
  <span class="mono footer-text"></span>
</footer>

<script src="data/loader.js"></script>
<script src="data/site-meta.js"></script>
<script>
  applySiteMeta('katalog');
  const grid = document.getElementById('catalogGrid');

  const extMap = { 'Android App': '.apk', 'Tools/Web': '.web', 'Scripts/Roblox': '.lua' };

  grid.innerHTML = SITE_DATA.produk.map(p => {
    const thumb = p.gambar
      ? `<img class="dir-thumb" src="${p.gambar}" alt="Preview ${p.nama}" loading="lazy">`
      : `<span class="dir-thumb placeholder">?</span>`;
    const hargaMulai = p.paket && p.paket.length
      ? p.paket.reduce((a,b) => (parseInt(a.harga.replace(/\D/g,'')) < parseInt(b.harga.replace(/\D/g,'')) ? a : b)).harga
      : 'Hubungi admin';
    const ext = extMap[p.kategori] || '.pkg';
    return `
      <a class="dir-row" href="produk.html?id=${encodeURIComponent(p.id)}">
        <div class="dir-name">
          ${thumb}
          <div class="dir-name-text">
            <strong>${p.nama}</strong>
            <span>${p.deskripsi}</span>
          </div>
        </div>
        <span class="dir-ext">${ext}</span>
        <span class="dir-size">${hargaMulai}</span>
        <span class="dir-open">buka →</span>
      </a>
    `;
  }).join('');
</script>

</body>
</html>
